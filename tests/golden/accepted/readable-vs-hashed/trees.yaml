    about.html:
      text: |
        <!doctype html>
        <html lang="en" data-kpress-theme="system" data-kpress-resolved-theme="light" data-kpress-palette="neutral" data-kpress-prose-font="serif" data-kpress-math-text="prose" data-kpress-mono-font="planetaire">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="color-scheme" content="light dark">
          <meta name="generator" content="kpress">
          <style>/* KPress standalone page-shell reset. render_page owns html/body so `.kpress-page-main`
           is the single scroll context (no nested window scrollbar). Inlined render-blocking in
           <head> by render_page only; the embeddable fragment never carries it, so an embedding
           host's own global styles stay untouched. See kpress-design.md "Standalone scroll model"
           / Conscious Departures #14/#15. Lives here, in a real CSS file -- not as a Python string. */
        html,
        body {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: hidden;
        }
        </style>
          <meta property="og:title" content="About">
          <meta property="og:type" content="website">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="About">
          <title>About</title>
          <script>// KPress pre-paint bootstrap. Inlined render-blocking into <head> by render_page so
        // persisted reader preferences are applied before first paint (no flash of the wrong
        // theme or fonts). It is a classic IIFE (not an ES module) and reads the server-set
        // `data-kpress-theme` attribute, so the renderer never interpolates anything into this
        // source -- it lives here, in a real JS file.
        //
        // It runs before the module runtime exists, so it reads raw localStorage: hosts that
        // swap the kpress.storage adapter (e.g. cookies) re-sync at runtime init; embedded
        // hosts never load this bootstrap at all (fragment path).
        (() => {
          const root = document.documentElement;
          // Native MathML uses the browser's math face. Reserve its space until the
          // enhanced result is ready, with recovery if scripts or font loads fail.
          root.dataset.kpressMathPending = "true";
          const mathState = /** @type {typeof globalThis & {kpressMathPendingTimer?: number}} */ (
            globalThis
          );
          mathState.kpressMathPendingTimer = setTimeout(() => {
            delete root.dataset.kpressMathPending;
          }, 3000);
          /** @param {string} key */
          const stored = (key) => {
            try {
              return localStorage.getItem(key);
            } catch {
              // localStorage can throw in private/sandboxed contexts; keep defaults.
              return null;
            }
          };

          // Theme: resolve `system` via the OS preference; always stamped.
          const mode = stored("kpress.theme") || root.dataset.kpressTheme || "system";
          const resolved =
            mode === "light" || mode === "dark"
              ? mode
              : globalThis.matchMedia?.("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          root.dataset.kpressTheme = mode;
          root.dataset.kpressResolvedTheme = resolved;

          // Other persisted reader preferences: stamped only when a choice exists
          // (CSS defaults apply otherwise).
          const proseFont = stored("kpress.proseFont");
          if (proseFont) {
            root.dataset.kpressProseFont = proseFont;
          }
          const fontSet = stored("kpress.fontSet");
          if (fontSet) {
            root.dataset.kpressFontSet = fontSet;
          }
        })();
        </script>
