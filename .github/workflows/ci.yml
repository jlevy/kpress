# CI: full quality gate, tests across supported Python versions, and a
# clean-install wheel smoke test.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  # Pushes to main and to the squares/** integration branches. The base of a stack
  # is where a bad merge resolution lands, and the merge commit a stacked pull
  # request creates when it merges down is a push, not a pull request, so without
  # the second pattern nothing ever builds it.
  push:
    branches: ["main", "squares/**"]
  # Pull requests into main, and into the squares/** integration branches, so a
  # pull request stacked on one of those is checked before it merges down.
  pull_request:
    branches: ["main", "squares/**"]

permissions:
  contents: read

env:
  # Supply-chain cool-off: only consider releases older than this, so CI never
  # resolves packages too new to have been vetted. uv (>= 0.9, and the version
  # pinned below) accepts a relative duration directly. See
  # SUPPLY-CHAIN-SECURITY.md and docs/development.md.
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  # Full quality gate: ruff, basedpyright, codespell, extraction safety check,
  # and the JS lint/type gates (Biome and tsc checkJs) against the pinned,
  # locked npm toolchain. Runs once because it is not Python-version-sensitive.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Important for versioning plugins:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (official Astral action)
        # Bump the action, uv version, and Linux checksum together.
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python (using uv)
        run: uv --config-file uv.toml python install

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      # Without these, `subset_mono --check` takes its pinned-hash path, which compares
      # the shipped subsets against recorded digests and so cannot catch a change to
      # the generator that alters what it would now write. With them it rebuilds every
      # subset and compares byte for byte. The download is self-verifying: the tool
      # hashes each file against the `source_sha256` pinned in SOURCES and exits 2 on a
      # mismatch, and it now refuses a partly populated cache rather than downgrading,
      # so a failed fetch fails the job instead of quietly weakening the gate.
      - name: Fetch the pinned upstream mono faces
        run: |
          mkdir -p ~/.cache/kpress/fonts
          cd ~/.cache/kpress/fonts
          for f in Regular Bold Italic BoldItalic Medium SemiBold ExtraBold; do
            curl -fLO --retry 3 --retry-all-errors \
              "https://cdn.jsdelivr.net/gh/jlevy/planetaire@v0.2.0/fonts/web/PlanetaireMonoText-$f.woff2"
          done

      - name: Run quality gates and audits
        run: make lint-check audit

  test:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Important for versioning plugins:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv --config-file uv.toml python install

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Run tests
        run: make test

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.14"

      - name: Install locked test dependencies
        run: uv --config-file uv.toml sync --locked --extra pdf --group dev

      # The locked Playwright wheel selects this browser revision. Installing it
      # is explicit because the CDN binary is outside the Python lock boundary.
      - name: Install Chromium and operating system dependencies
        run: uv --config-file uv.toml run --frozen --extra pdf python -m playwright install --with-deps chromium

      - name: Verify real fonts and first visible mathematics
        run: make test-browser

  # Build both distributions and run the shared artifact inspection plus
  # isolated installed-wheel smoke test owned by make build.
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv --config-file uv.toml python install

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Build sdist + wheel
        run: make build
